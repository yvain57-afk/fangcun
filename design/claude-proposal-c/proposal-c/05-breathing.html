<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方寸 - 节律呼吸</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #E8EEF5;
    font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .iphone-frame {
    width: 393px;
    height: 852px;
    background: #FAFBFD;
    border-radius: 47px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 0 3px #1a1a1a, 0 20px 60px rgba(0,0,0,0.15);
    color: #2D3748;
  }

  .dynamic-island {
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    width: 126px;
    height: 37px;
    background: #000;
    border-radius: 20px;
    z-index: 10;
  }

  .status-bar {
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px 0;
    font-size: 15px;
    font-weight: 600;
  }
  .status-bar .time { font-weight: 700; font-variant-numeric: tabular-nums; }
  .status-bar .icons { display: flex; gap: 5px; align-items: center; }

  .screen-content {
    height: calc(852px - 54px);
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    background: linear-gradient(180deg, #EDF3FB 0%, #F0F5FB 40%, #F4F7FC 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .screen-content::-webkit-scrollbar { display: none; }

  .breathing-header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 16px 24px 0;
  }

  .breathing-title {
    font-size: 17px;
    font-weight: 600;
    color: #1E4578;
    letter-spacing: 0.5px;
  }

  .close-button {
    position: absolute;
    right: 24px;
    top: 16px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(43, 94, 167, 0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .close-button svg {
    width: 14px;
    height: 14px;
  }

  .breathing-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-bottom: 40px;
    margin-top: -20px;
  }

  .breathing-ring-container {
    position: relative;
    width: 220px;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 40px;
  }

  .breathing-ring-glow {
    position: absolute;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(43, 94, 167, 0.06) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .breathing-ring-svg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .breathing-label-group {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .phase-label {
    font-size: 22px;
    font-weight: 500;
    color: #1E4578;
    letter-spacing: 2px;
  }

  .countdown-number {
    font-size: 52px;
    font-weight: 700;
    color: #2B5EA7;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .progress-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  .progress-dots {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .progress-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #D8DCE5;
  }

  .progress-dot.filled {
    background: #2B5EA7;
  }

  .progress-text {
    font-size: 14px;
    color: #6B7793;
    font-weight: 400;
  }

  .time-remaining {
    font-size: 15px;
    color: #8A95AD;
    font-variant-numeric: tabular-nums;
    margin-bottom: 8px;
  }

  .cat-stamp {
    opacity: 0.4;
    margin-bottom: 32px;
    margin-top: 8px;
  }

  .control-buttons {
    display: flex;
    gap: 16px;
    align-items: center;
    padding-bottom: 40px;
  }

  .btn-pause {
    padding: 12px 36px;
    border-radius: 24px;
    border: 1.5px solid #2B5EA7;
    background: transparent;
    color: #2B5EA7;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.5px;
    font-family: inherit;
  }

  .btn-end {
    padding: 12px 28px;
    border-radius: 24px;
    border: none;
    background: transparent;
    color: #8A95AD;
    font-size: 16px;
    font-weight: 400;
    cursor: pointer;
    letter-spacing: 0.5px;
    font-family: inherit;
  }

  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    background: #1a1a1a;
    border-radius: 3px;
  }
</style>
</head>
