<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方寸 - Proposal B - 记录饮品</title>
<style>
  :root {
    --fc-blue: #2B5EA7; --fc-blue-dark: #1E4578; --fc-blue-light: #E8EFF8;
    --fc-blue-muted: #94B3D7; --fc-blue-50: #F0F5FB;
    --fc-orange: #E07B4F; --fc-orange-light: #FDF0EB;
    --fc-text: #2D3748; --fc-text-secondary: #6B7793; --fc-text-tertiary: #8A95AD;
    --fc-gray-50: #F5F7FA; --fc-gray-100: #ECEEF3; --fc-gray-200: #D8DCE5;
    --fc-shadow-sm: 0 1px 3px rgba(43,94,167,0.06);
    --fc-shadow-md: 0 2px 8px rgba(43,94,167,0.08);
    --fc-shadow-lg: 0 4px 16px rgba(43,94,167,0.10);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#E8EEF5;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:-apple-system,'PingFang SC',sans-serif;-webkit-font-smoothing:antialiased}
  .iphone-frame{width:393px;height:852px;border-radius:47px;box-shadow:0 0 0 3px #1a1a1a,0 20px 60px rgba(0,0,0,.15);background:#FEFDFB;position:relative;overflow:hidden}
  .dynamic-island{width:126px;height:37px;background:#000;border-radius:20px;position:absolute;top:11px;left:50%;transform:translateX(-50%);z-index:10}
  .status-bar{height:54px;padding:14px 28px 0;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:5}
  .status-time{font-size:16px;font-weight:700;color:var(--fc-text)}
  .status-icons{display:flex;align-items:center;gap:6px}
  .home-indicator{width:134px;height:5px;background:#1a1a1a;border-radius:3px;position:absolute;bottom:8px;left:50%;transform:translateX(-50%);z-index:20}

  /* Dimmed background content */
  .bg-content{height:calc(852px - 54px);opacity:.3;padding:16px 20px}
  .bg-date{font-size:14px;color:var(--fc-text-secondary);margin-bottom:12px}
  .bg-card{background:#EDF3FB;border-radius:16px;padding:20px;text-align:center;margin-bottom:16px}
  .bg-card-title{font-size:18px;font-weight:600;color:var(--fc-blue)}

  /* Dark overlay */
  .overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:12}

  /* Bottom sheet */
  .bottom-sheet{position:absolute;bottom:0;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;z-index:15;padding:12px 20px 34px;box-shadow:0 -4px 20px rgba(0,0,0,.1)}
  .sheet-handle{width:36px;height:4px;background:#D8DCE5;border-radius:2px;margin:0 auto 16px}
  .sheet-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .sheet-title{font-size:18px;font-weight:600;color:var(--fc-text)}
  .sheet-close{width:28px;height:28px;border-radius:50%;background:var(--fc-gray-50);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}

  /* Dog decoration in header */
  .sheet-header-area{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
  .sheet-header-left{flex:1}

  /* Bev grid */
  .bev-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .bev-card{background:var(--fc-gray-50);border-radius:12px;padding:14px 12px;text-align:center}
  .bev-card.water{background:var(--fc-blue-50)}
  .bev-emoji{font-size:24px;margin-bottom:4px}
  .bev-count{font-size:20px;font-weight:700;color:var(--fc-text)}
  .bev-name{font-size:12px;color:var(--fc-text-secondary);margin-top:2px}
  .bev-unrecorded{font-size:11px;color:var(--fc-text-tertiary);margin-top:2px}
  .bev-stepper{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:8px}
  .stepper-btn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--fc-gray-200);background:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--fc-blue);cursor:pointer;font-weight:500}
  .stepper-btn:active{background:var(--fc-blue-50)}

  /* Quick add */
  .qa-label{font-size:13px;font-weight:500;color:var(--fc-text-secondary);margin-bottom:8px}
  .qa-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .qa-pill{height:32px;padding:0 14px;border-radius:100px;font-size:13px;display:inline-flex;align-items:center;border:none;cursor:pointer;font-family:inherit}
  .qa-pill.primary{background:var(--fc-blue-light);color:var(--fc-blue);font-weight:500}
  .qa-pill.neutral{background:var(--fc-gray-50);color:var(--fc-text-secondary)}

  /* Today log */
  .log-label{font-size:13px;font-weight:500;color:var(--fc-text-secondary);margin-bottom:8px}
  .log-list{margin-bottom:16px;max-height:120px;overflow-y:auto}
  .log-item{font-size:13px;color:var(--fc-text);padding:5px 0 5px 12px;border-left:2px solid var(--fc-blue-light)}
  .log-item+.log-item{margin-top:4px}
  .log-time{color:var(--fc-text-tertiary);margin-right:6px}

  /* Save button */
  .save-btn{width:100%;height:48px;background:var(--fc-blue);color:#fff;border:none;border-radius:100px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
  .save-btn:active{opacity:.85}
</style>
</head>
<body>
<div class="iphone-frame">
  <div class="dynamic-island"></div>
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-icons">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><rect x="0" y="8" width="3" height="4" rx=".5" fill="#2D3748"/><rect x="4.5" y="5" width="3" height="7" rx=".5" fill="#2D3748"/><rect x="9" y="2" width="3" height="10" rx=".5" fill="#2D3748"/><rect x="13.5" y="0" width="3" height="12" rx=".5" fill="#2D3748"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 11.5a1.2 1.2 0 100-2.4 1.2 1.2 0 000 2.4z" fill="#2D3748"/><path d="M4.7 8.1a4.7 4.7 0 016.6 0" stroke="#2D3748" stroke-width="1.3" stroke-linecap="round"/><path d="M2.3 5.5a8 8 0 0111.4 0" stroke="#2D3748" stroke-width="1.3" stroke-linecap="round"/><path d="M0 3a11.2 11.2 0 0116 0" stroke="#2D3748" stroke-width="1.3" stroke-linecap="round"/></svg>
      <svg width="27" height="12" viewBox="0 0 27 12" fill="none"><rect x=".5" y=".5" width="23" height="11" rx="2.5" stroke="#2D3748" stroke-opacity=".35"/><rect x="2" y="2" width="20" height="8" rx="1.5" fill="#2D3748"/><path d="M25 4v4a2 2 0 000-4z" fill="#2D3748" fill-opacity=".4"/></svg>
    </div>
  </div>

  <!-- Dimmed BG -->
  <div class="bg-content">
    <div class="bg-date">9月17日 周三</div>
    <div class="bg-card"><div class="bg-card-title">今日压力负荷平稳</div></div>
  </div>

  <!-- Overlay -->
  <div class="overlay"></div>

  <!-- Bottom Sheet -->
  <div class="bottom-sheet">
    <div class="sheet-handle"></div>

    <div class="sheet-header-area">
      <div class="sheet-header-left">
        <div class="sheet-header">
          <span class="sheet-title">记录饮品</span>
          <button class="sheet-close">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 3l8 8M11 3l-8 8" stroke="#8A95AD" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
      <!-- Small dog with cup -->
      <svg width="56" height="50" viewBox="0 0 56 50" fill="none" style="flex-shrink:0;margin-top:-8px;margin-right:-4px">
        <ellipse cx="28" cy="32" rx="20" ry="12" fill="white" stroke="#2B5EA7" stroke-width="2"/>
        <ellipse cx="34" cy="30" rx="7" ry="5" fill="#E07B4F" opacity=".25"/>
        <ellipse cx="15" cy="24" rx="10" ry="9" fill="white" stroke="#2B5EA7" stroke-width="2"/>
        <ellipse cx="8" cy="27" rx="5" ry="4" fill="white" stroke="#2B5EA7" stroke-width="2"/>
        <ellipse cx="5" cy="26" rx="2" ry="1.5" fill="#1a1a1a"/>
        <path d="M8 19c-3-3-7-3-8 0s0 7 3 7" fill="white" stroke="#2B5EA7" stroke-width="1.5"/>
        <path d="M22 17c2-4 7-5 9-2s-1 7-4 8" fill="#E07B4F" stroke="#2B5EA7" stroke-width="1.5"/>
        <circle cx="12" cy="23" r="1.8" fill="#1a1a1a"/><circle cx="19" cy="22" r="1.8" fill="#1a1a1a"/>
        <!-- Tiny cup -->
        <rect x="44" y="24" width="8" height="10" rx="2" fill="white" stroke="#2B5EA7" stroke-width="1.5"/>
        <path d="M52 27h2c1 0 2 1 2 2s-1 2-2 2h-2" stroke="#2B5EA7" stroke-width="1.2" fill="none"/>
        <rect x="45" y="26" width="6" height="2" rx="1" fill="#94B3D7" opacity=".4"/>
      </svg>
    </div>

    <!-- Category grid -->
    <div class="bev-grid">
      <div class="bev-card water">
        <div class="bev-emoji">💧</div>
        <div class="bev-count">4杯</div>
        <div class="bev-name">饮水</div>
        <div class="bev-stepper">
          <button class="stepper-btn">-</button>
          <button class="stepper-btn">+</button>
        </div>
      </div>
      <div class="bev-card">
        <div class="bev-emoji">☕</div>
        <div class="bev-count">1杯</div>
        <div class="bev-name">咖啡因</div>
        <div class="bev-stepper">
          <button class="stepper-btn">-</button>
          <button class="stepper-btn">+</button>
        </div>
      </div>
      <div class="bev-card">
        <div class="bev-emoji">🍺</div>
        <div class="bev-count" style="color:var(--fc-text-tertiary)">0杯</div>
        <div class="bev-name">酒精</div>
        <div class="bev-unrecorded">未记录</div>
        <div class="bev-stepper">
          <button class="stepper-btn">-</button>
          <button class="stepper-btn">+</button>
        </div>
      </div>
      <div class="bev-card">
        <div class="bev-emoji">🥤</div>
        <div class="bev-count" style="color:var(--fc-text-tertiary)">0杯</div>
        <div class="bev-name">含糖饮料</div>
        <div class="bev-unrecorded">未记录</div>
        <div class="bev-stepper">
          <button class="stepper-btn">-</button>
          <button class="stepper-btn">+</button>
        </div>
      </div>
    </div>

    <!-- Quick add -->
    <div class="qa-label">快速添加</div>
    <div class="qa-row">
      <button class="qa-pill primary">一杯水 +250ml</button>
      <button class="qa-pill neutral">美式</button>
      <button class="qa-pill neutral">拿铁</button>
      <button class="qa-pill neutral">啤酒一罐</button>
      <button class="qa-pill neutral">气泡水</button>
    </div>

    <!-- Today's log -->
    <div class="log-label">今日已记录</div>
    <div class="log-list">
      <div class="log-item"><span class="log-time">09:00</span>一杯水 250ml</div>
      <div class="log-item"><span class="log-time">10:30</span>美式咖啡</div>
      <div class="log-item"><span class="log-time">12:00</span>一杯水 250ml</div>
      <div class="log-item"><span class="log-time">14:00</span>一杯水 250ml</div>
      <div class="log-item"><span class="log-time">16:00</span>一杯水 250ml</div>
    </div>

    <button class="save-btn">完成</button>
  </div>

  <div class="home-indicator"></div>
</div>
</body>
</html>
