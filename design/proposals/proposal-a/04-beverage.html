<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方寸 - 饮品记录</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #E8EEF5;
    font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .iphone-frame {
    width: 393px;
    height: 852px;
    background: #FFFFFF;
    border-radius: 47px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 0 3px #1a1a1a, 0 20px 60px rgba(0,0,0,0.15);
    color: #2D3748;
  }

  .dynamic-island {
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    width: 126px;
    height: 37px;
    background: #000;
    border-radius: 20px;
    z-index: 10;
  }

  .status-bar {
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.2px;
  }
  .status-bar .time { font-weight: 700; font-variant-numeric: tabular-nums; }
  .status-bar .icons { display: flex; gap: 5px; align-items: center; }

  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    background: #1a1a1a;
    border-radius: 3px;
  }

  /* Sheet overlay background */
  .sheet-bg {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.3);
    z-index: 5;
    border-radius: 47px;
  }

  /* Bottom sheet */
  .bottom-sheet {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: #FFFFFF;
    border-radius: 24px 24px 0 0;
    z-index: 20;
    padding-bottom: 34px;
    max-height: 720px;
    overflow-y: auto;
  }
  .bottom-sheet::-webkit-scrollbar { display: none; }

  .sheet-handle {
    width: 36px;
    height: 5px;
    background: #D8DCE5;
    border-radius: 3px;
    margin: 10px auto 0;
  }

  .sheet-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 12px;
  }
  .sheet-title {
    font-size: 20px;
    font-weight: 700;
    color: #2D3748;
    letter-spacing: -0.3px;
  }
  .sheet-close {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #F5F7FA;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .sheet-date {
    padding: 0 20px 16px;
    font-size: 13px;
    color: #8A95AD;
  }

  /* 2x2 Beverage Grid */
  .bev-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 0 20px;
    margin-bottom: 20px;
  }

  .bev-card {
    background: #F5F7FA;
    border-radius: 16px;
    padding: 16px;
    text-align: center;
    position: relative;
  }
  .bev-card.active {
    background: #EDF3FB;
    border: 1.5px solid rgba(43,94,167,0.15);
  }
  .bev-card.warn-active {
    background: #FDF0EB;
    border: 1.5px solid rgba(199,91,42,0.15);
  }

  .bev-emoji {
    font-size: 28px;
    margin-bottom: 6px;
    line-height: 1;
  }
  .bev-label {
    font-size: 13px;
    color: #6B7793;
    margin-bottom: 8px;
    font-weight: 500;
  }
  .bev-value {
    font-size: 28px;
    font-weight: 700;
    color: #2D3748;
    line-height: 1;
    margin-bottom: 2px;
    font-variant-numeric: tabular-nums;
  }
  .bev-unit {
    font-size: 12px;
    color: #8A95AD;
    margin-bottom: 12px;
  }

  .bev-stepper {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  .bev-stepper-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1.5px solid #D8DCE5;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s;
  }
  .bev-stepper-btn:active {
    background: #F0F5FB;
    border-color: #94B3D7;
  }
  .bev-not-recorded {
    font-size: 11px;
    color: #B8BFD0;
    margin-top: 4px;
  }

  /* Quick add section */
  .quick-section {
    padding: 0 20px;
    margin-bottom: 20px;
  }
  .quick-title {
    font-size: 14px;
    font-weight: 600;
    color: #4A5568;
    margin-bottom: 10px;
  }
  .quick-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .quick-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    background: #F5F7FA;
    border-radius: 100px;
    border: 1px solid #ECEEF3;
    font-size: 14px;
    color: #4A5568;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .quick-chip:active {
    background: #EDF3FB;
    border-color: #94B3D7;
  }
  .quick-chip .qc-icon {
    font-size: 16px;
  }

  /* Dog decoration */
  .sheet-deco {
    display: flex;
    justify-content: flex-end;
    padding: 0 24px 4px;
  }

  /* Note about recording */
  .bev-note {
    margin: 0 20px 16px;
    padding: 10px 14px;
    background: #F0F5FB;
    border-radius: 10px;
    font-size: 12px;
    color: #6B7793;
    line-height: 1.45;
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .bev-note-icon {
    font-size: 14px;
    flex-shrink: 0;
    margin-top: 1px;
  }

  /* Save button */
  .save-section {
    padding: 0 20px 8px;
  }
  .save-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 48px;
    background: #2B5EA7;
    color: white;
    border: none;
    border-radius: 100px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
</style>
</head>
<body>

<div class="iphone-frame">
  <div class="dynamic-island"></div>

  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="icons">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="#2D3748"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="#2D3748"/><rect x="9" y="1" width="3" height="11" rx="1" fill="#2D3748"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="#2D3748"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 3.6C10.2 3.6 12.1 4.5 13.5 6L15 4.5C13.2 2.6 10.7 1.5 8 1.5S2.8 2.6 1 4.5L2.5 6C3.9 4.5 5.8 3.6 8 3.6Z" fill="#2D3748"/><path d="M8 7.2C9.3 7.2 10.5 7.7 11.3 8.6L8 12L4.7 8.6C5.5 7.7 6.7 7.2 8 7.2Z" fill="#2D3748"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0" y="1" width="22" height="10" rx="2" stroke="#2D3748" stroke-width="1" fill="none"/><rect x="22.5" y="4" width="2" height="4" rx="1" fill="#2D3748"/><rect x="1.5" y="2.5" width="18" height="7" rx="1" fill="#2D3748"/></svg>
    </div>
  </div>

  <!-- Dimmed background content hint -->
  <div class="sheet-bg"></div>

  <!-- Bottom Sheet -->
  <div class="bottom-sheet">
    <div class="sheet-handle"></div>

    <div class="sheet-header">
      <span class="sheet-title">记录饮品</span>
      <button class="sheet-close">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><line x1="3" y1="3" x2="11" y2="11" stroke="#4A5568" stroke-width="1.8" stroke-linecap="round"/><line x1="11" y1="3" x2="3" y2="11" stroke="#4A5568" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="sheet-date">9月17日 周三</div>

    <!-- Dog with cup decoration -->
    <div class="sheet-deco">
      <svg width="52" height="48" viewBox="0 0 52 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Dog body, smaller -->
        <g transform="translate(0, 8)">
          <ellipse cx="26" cy="28" rx="16" ry="8" fill="white" stroke="#2B5EA7" stroke-width="1.5"/>
          <ellipse cx="30" cy="27" rx="6" ry="3.5" fill="#E07B4F" opacity="0.15"/>
          <!-- Dog head -->
          <circle cx="12" cy="20" r="9" fill="white" stroke="#2B5EA7" stroke-width="1.5"/>
          <!-- Left ear -->
          <path d="M5 13 C1 10, -1 17, 3 20" fill="white" stroke="#2B5EA7" stroke-width="1.3" stroke-linecap="round"/>
          <!-- Right ear (orange) -->
          <path d="M19 13 C23 10, 25 17, 21 20" fill="#E07B4F" stroke="#2B5EA7" stroke-width="1.3" stroke-linecap="round"/>
          <!-- Eyes -->
          <circle cx="9" cy="19" r="1.2" fill="#2B5EA7"/>
          <circle cx="15" cy="19" r="1.2" fill="#2B5EA7"/>
          <!-- Nose -->
          <ellipse cx="12" cy="23" rx="1.8" ry="1.1" fill="#2B5EA7"/>
          <!-- Small cup held by paw -->
          <rect x="37" y="24" width="10" height="12" rx="2" fill="white" stroke="#2B5EA7" stroke-width="1.3"/>
          <path d="M47 28 C50 28, 50 32, 47 32" stroke="#2B5EA7" stroke-width="1.2" fill="none"/>
          <!-- Steam -->
          <path d="M40 22 C40 20, 42 20, 42 22" stroke="#94B3D7" stroke-width="0.8" fill="none" stroke-linecap="round"/>
          <path d="M43 21 C43 19, 45 19, 45 21" stroke="#94B3D7" stroke-width="0.8" fill="none" stroke-linecap="round"/>
          <!-- Paws -->
          <ellipse cx="10" cy="35" rx="3.5" ry="2" fill="white" stroke="#2B5EA7" stroke-width="1.2"/>
          <ellipse cx="18" cy="35" rx="3.5" ry="2" fill="white" stroke="#2B5EA7" stroke-width="1.2"/>
          <!-- Tail -->
          <path d="M42 26 C45 23, 46 27, 44 28" stroke="#2B5EA7" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        </g>
      </svg>
    </div>

    <!-- 2x2 Grid -->
    <div class="bev-grid">
      <!-- Water -->
      <div class="bev-card active">
        <div class="bev-emoji">💧</div>
        <div class="bev-label">饮水</div>
        <div class="bev-value">4</div>
        <div class="bev-unit">杯</div>
        <div class="bev-stepper">
          <button class="bev-stepper-btn">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><line x1="3" y1="7" x2="11" y2="7" stroke="#2B5EA7" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <button class="bev-stepper-btn">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><line x1="7" y1="3" x2="7" y2="11" stroke="#2B5EA7" stroke-width="1.8" stroke-linecap="round"/><line x1="3" y1="7" x2="11" y2="7" stroke="#2B5EA7" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>

      <!-- Caffeine -->
      <div class="bev-card active">
        <div class="bev-emoji">☕</div>
        <div class="bev-label">咖啡因</div>
        <div class="bev-value">1</div>
        <div class="bev-unit">杯</div>
        <div class="bev-stepper">
          <button class="bev-stepper-btn">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><line x1="3" y1="7" x2="11" y2="7" stroke="#2B5EA7" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <button class="bev-stepper-btn">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><line x1="7" y1="3" x2="7" y2="11" stroke="#2B5EA7" stroke-width="1.8" stroke-linecap="round"/><line x1="3" y1="7" x2="11" y2="7" stroke="#2B5EA7" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>

      <!-- Alcohol -->
      <div class="bev-card">
        <div class="bev-emoji">🍺</div>
        <div class="bev-label">酒精</div>
        <div class="bev-value" style="color:#B8BFD0;">0</div>
        <div class="bev-unit">杯</div>
        <div class="bev-stepper">
          <button class="bev-stepper-btn">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><line x1="3" y1="7" x2="11" y2="7" stroke="#B8BFD0" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <button class="bev-stepper-btn">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><line x1="7" y1="3" x2="7" y2="11" stroke="#2B5EA7" stroke-width="1.8" stroke-linecap="round"/><line x1="3" y1="7" x2="11" y2="7" stroke="#2B5EA7" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="bev-not-recorded">未记录</div>
      </div>

      <!-- Sugary -->
      <div class="bev-card">
        <div class="bev-emoji">🧃</div>
        <div class="bev-label">含糖饮料</div>
        <div class="bev-value" style="color:#B8BFD0;">0</div>
        <div class="bev-unit">杯</div>
        <div class="bev-stepper">
          <button class="bev-stepper-btn">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><line x1="3" y1="7" x2="11" y2="7" stroke="#B8BFD0" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <button class="bev-stepper-btn">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><line x1="7" y1="3" x2="7" y2="11" stroke="#2B5EA7" stroke-width="1.8" stroke-linecap="round"/><line x1="3" y1="7" x2="11" y2="7" stroke="#2B5EA7" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="bev-not-recorded">未记录</div>
      </div>
    </div>

    <!-- Quick Add -->
    <div class="quick-section">
      <div class="quick-title">快速添加</div>
      <div class="quick-grid">
        <button class="quick-chip"><span class="qc-icon">💧</span> 一杯水</button>
        <button class="quick-chip"><span class="qc-icon">☕</span> 美式咖啡</button>
        <button class="quick-chip"><span class="qc-icon">☕</span> 拿铁</button>
        <button class="quick-chip"><span class="qc-icon">🍵</span> 绿茶</button>
        <button class="quick-chip"><span class="qc-icon">🥤</span> 奶茶</button>
        <button class="quick-chip"><span class="qc-icon">🍺</span> 啤酒</button>
        <button class="quick-chip"><span class="qc-icon">🍷</span> 红酒</button>
      </div>
    </div>

    <!-- Note -->
    <div class="bev-note">
      <span class="bev-note-icon">ℹ️</span>
      <span>"未记录"表示今天还未记录该类饮品，与"记录为0杯"不同。点击 +/- 开始记录。</span>
    </div>

    <!-- Save -->
    <div class="save-section">
      <button class="save-btn">保存</button>
    </div>
  </div>

  <div class="home-indicator"></div>
</div>

</body>
</html>
