<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方寸 - 今天（数据不足）</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #E8EEF5;
    font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .iphone-frame {
    width: 393px;
    height: 852px;
    background: #FAFBFD;
    border-radius: 47px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 0 3px #1a1a1a, 0 20px 60px rgba(0,0,0,0.15);
    color: #2D3748;
  }

  .dynamic-island {
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    width: 126px;
    height: 37px;
    background: #000;
    border-radius: 20px;
    z-index: 10;
  }

  .status-bar {
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px 0;
    font-size: 15px;
    font-weight: 600;
  }
  .status-bar .time { font-weight: 700; font-variant-numeric: tabular-nums; }
  .status-bar .icons { display: flex; gap: 5px; align-items: center; }

  .screen-content {
    height: calc(852px - 54px - 83px);
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
  }
  .screen-content::-webkit-scrollbar { display: none; }

  .tab-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 83px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 0.5px solid #D8DCE5;
    display: flex;
    align-items: flex-start;
    justify-content: space-around;
    padding-top: 8px;
  }
  .tab-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-size: 10px;
    color: #8A95AD;
    width: 64px;
  }
  .tab-item.active { color: #2B5EA7; }
  .tab-icon { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }

  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    background: #1a1a1a;
    border-radius: 3px;
  }

  /* Date header */
  .date-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px 0;
  }
  .date-header-left {
    display: flex;
    flex-direction: column;
  }
  .date-title {
    font-size: 22px;
    font-weight: 700;
    color: #2D3748;
    letter-spacing: 0.3px;
  }
  .date-rule {
    margin: 10px 24px 0;
    border: none;
    height: 0.5px;
    background: #D8DCE5;
  }
  .cat-stamp-header {
    opacity: 0.4;
    flex-shrink: 0;
  }

  /* Section cards */
  .section-card {
    margin: 16px 20px;
    background: #fff;
    border-radius: 14px;
    padding: 18px 18px;
    position: relative;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04), 0 0 1px rgba(0,0,0,0.06);
    overflow: hidden;
  }
  .section-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    border-radius: 14px 0 0 14px;
  }
  .section-card.border-gray::before { background: #8A9AB5; }
  .section-card.border-warm::before { background: #E07B4F; opacity: 0.6; }
  .section-card.border-blue::before { background: #2B5EA7; }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .card-title {
    font-size: 15px;
    font-weight: 600;
    color: #2D3748;
  }
  .card-pill {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
  }
  .pill-gray {
    background: #F3F5F8;
    color: #8A9AB5;
  }

  .card-main-text {
    font-size: 20px;
    font-weight: 600;
    color: #8A9AB5;
    margin-bottom: 14px;
  }

  .baseline-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .baseline-label {
    font-size: 13px;
    color: #6B7793;
    flex-shrink: 0;
  }
  .progress-track {
    flex: 1;
    height: 6px;
    background: #EDEFF4;
    border-radius: 3px;
    overflow: hidden;
    max-width: 120px;
  }
  .progress-fill {
    height: 100%;
    background: #8A9AB5;
    border-radius: 3px;
    transition: width 0.3s ease;
  }
  .baseline-fraction {
    font-size: 12px;
    color: #8A9AB5;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  .card-subtext {
    font-size: 12px;
    color: #8A95AD;
    line-height: 1.5;
    margin-top: 4px;
  }

  /* Stamp dividers */
  .stamp-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2px 0;
  }
  .stamp-divider svg {
    opacity: 0.4;
  }

  /* Body signals */
  .signal-row {
    display: flex;
    align-items: flex-start;
    padding: 10px 0;
    border-bottom: 1px dashed #E8ECF2;
  }
  .signal-row:last-child {
    border-bottom: none;
    padding-bottom: 0;
  }
  .signal-row:first-child {
    padding-top: 0;
  }
  .signal-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-right: 12px;
    background: #F3F5F8;
  }
  .signal-content {
    flex: 1;
  }
  .signal-label {
    font-size: 14px;
    font-weight: 500;
    color: #2D3748;
    margin-bottom: 2px;
  }
  .signal-status {
    font-size: 12px;
    color: #8A9AB5;
    font-weight: 500;
  }
  .signal-detail {
    font-size: 11px;
    color: #A0A9BC;
    margin-top: 2px;
    line-height: 1.4;
  }
  .signal-value {
    font-size: 14px;
    font-weight: 600;
    color: #8A9AB5;
    flex-shrink: 0;
    margin-left: 8px;
    align-self: center;
  }

  /* Life record empty */
  .empty-state {
    text-align: center;
    padding: 16px 0 8px;
  }
  .empty-text {
    font-size: 14px;
    color: #8A95AD;
    margin-bottom: 14px;
  }
  .btn-outline {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 20px;
    border-radius: 22px;
    border: 1.5px solid #E07B4F;
    color: #E07B4F;
    font-size: 14px;
    font-weight: 500;
    background: transparent;
    cursor: pointer;
  }
  .btn-outline:hover {
    background: #FDF0EB;
  }

  /* Action card */
  .action-title {
    font-size: 15px;
    font-weight: 600;
    color: #2D3748;
    margin-bottom: 6px;
  }
  .action-desc {
    font-size: 13px;
    color: #6B7793;
    line-height: 1.5;
    margin-bottom: 16px;
  }
  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 24px;
    border-radius: 22px;
    background: #2B5EA7;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    border: none;
    cursor: pointer;
  }
  .btn-primary:hover {
    background: #1E4578;
  }
  .btn-primary svg {
    flex-shrink: 0;
  }

  /* Paper texture */
  .section-card::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.015;
    background-image: url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
    background-size: 200px 200px;
  }
</style>
</head>
