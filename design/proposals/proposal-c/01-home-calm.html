<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proposal C - Home Calm</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #E8EEF5;
    font-family: -apple-system, 'PingFang SC', sans-serif;
  }

  .iphone-frame {
    width: 393px;
    height: 852px;
    border-radius: 47px;
    box-shadow: 0 0 0 3px #1a1a1a, 0 20px 60px rgba(0,0,0,0.15);
    background: #FAFBFD;
    position: relative;
    overflow: hidden;
  }

  .dynamic-island {
    width: 126px;
    height: 37px;
    background: #000;
    border-radius: 20px;
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
  }

  .status-bar {
    height: 54px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 28px 6px 28px;
    position: relative;
    z-index: 5;
  }

  .status-bar .time {
    font-size: 15px;
    font-weight: 700;
    color: #2D3748;
    letter-spacing: 0.5px;
  }

  .status-bar .icons {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .screen-content {
    height: calc(852px - 54px - 83px);
    overflow-y: auto;
    padding: 0 20px;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }

  .screen-content::-webkit-scrollbar {
    display: none;
  }

  /* Date header */
  .date-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0 10px 0;
  }

  .date-header .date-text {
    font-size: 22px;
    font-weight: 700;
    color: #2D3748;
    letter-spacing: 0.5px;
  }

  .date-header .date-sub {
    font-size: 13px;
    color: #8A95AD;
    margin-top: 2px;
  }

  .date-divider {
    height: 1px;
    background: linear-gradient(to right, #2B5EA7, #94B3D7, transparent);
    margin-bottom: 16px;
    opacity: 0.4;
  }

  /* Section cards */
  .section-card {
    background: #fff;
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 0;
    position: relative;
    box-shadow: 0 1px 4px rgba(43,94,167,0.06), 0 0 0 0.5px rgba(43,94,167,0.04);
    overflow: hidden;
  }

  .section-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    border-radius: 14px 0 0 14px;
  }

  .section-card.blue::before {
    background: #2B5EA7;
  }

  .section-card.warm::before {
    background: #E07B4F;
  }

  .section-card.neutral::before {
    background: #C4C9D4;
  }

  /* Stamp separator */
  .stamp-separator {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 0;
    opacity: 0.4;
  }

  /* Pill tag */
  .pill-tag {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }

  .pill-tag.calm {
    background: #E8EFF8;
    color: #2B5EA7;
  }

  /* Section title */
  .section-label {
    font-size: 12px;
    color: #8A95AD;
    font-weight: 500;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }

  .section-main-text {
    font-size: 17px;
    font-weight: 600;
    color: #2D3748;
    margin-top: 8px;
    line-height: 1.5;
  }

  .section-sub-text {
    font-size: 13px;
    color: #8A95AD;
    margin-top: 4px;
    line-height: 1.5;
  }

  /* Calm indicator */
  .calm-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
  }

  .calm-wave {
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .calm-wave .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #94B3D7;
  }

  .calm-wave .dot.active {
    background: #2B5EA7;
  }

  /* Stats row */
  .stats-row {
    display: flex;
    gap: 0;
    margin-top: 10px;
  }

  .stat-block {
    flex: 1;
    text-align: center;
    position: relative;
  }

  .stat-block + .stat-block::before {
    content: '';
    position: absolute;
    left: 0;
    top: 6px;
    bottom: 6px;
    width: 0.5px;
    background: #E0E4EC;
  }

  .stat-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 6px;
  }

  .stat-value {
    font-size: 17px;
    font-weight: 700;
    color: #2D3748;
    line-height: 1.3;
  }

  .stat-label {
    font-size: 11px;
    color: #8A95AD;
    margin-top: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
  }

  .stat-label .arrow-up {
    color: #2B5EA7;
    font-size: 10px;
    font-weight: 700;
  }

  .stat-label .dot-normal {
    display: inline-block;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #2B5EA7;
    vertical-align: middle;
  }

  /* Life record card */
  .record-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .record-title {
    font-size: 14px;
    font-weight: 600;
    color: #2D3748;
  }

  .add-btn {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #FDF0EB;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .chip-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 13px;
    color: #2D3748;
    background: #F5F6F8;
    font-weight: 500;
  }

  .chip .chip-icon {
    margin-right: 5px;
  }

  .record-sub-section {
    padding-top: 10px;
    border-top: 0.5px solid #ECEEF3;
  }

  .record-sub-title {
    font-size: 13px;
    font-weight: 600;
    color: #6B7793;
    margin-bottom: 6px;
  }

  .record-sub-text {
    font-size: 13px;
    color: #8A95AD;
    line-height: 1.6;
  }

  .record-sub-text .highlight {
    color: #2D3748;
    font-weight: 500;
  }

  /* Action card */
  .action-title {
    font-size: 16px;
    font-weight: 700;
    color: #2D3748;
    margin-bottom: 12px;
  }

  .duration-chips {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }

  .duration-chip {
    flex: 1;
    text-align: center;
    padding: 8px 0;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    color: #6B7793;
    background: #F5F6F8;
    cursor: pointer;
  }

  .duration-chip.selected {
    background: #E8EFF8;
    color: #2B5EA7;
    font-weight: 700;
    box-shadow: inset 0 0 0 1.5px #2B5EA7;
  }

  .start-btn {
    width: 100%;
    padding: 14px 0;
    border-radius: 12px;
    background: #2B5EA7;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
    letter-spacing: 1px;
  }

  .evidence-link {
    display: block;
    text-align: center;
    margin-top: 14px;
    font-size: 13px;
    color: #2B5EA7;
    font-weight: 500;
    cursor: pointer;
    padding-bottom: 20px;
  }

  /* Tab bar */
  .tab-bar {
    height: 83px;
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 0.5px solid #D8DCE5;
    display: flex;
    align-items: flex-start;
    padding-top: 8px;
    z-index: 8;
  }

  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
  }

  .tab-item .tab-icon {
    color: #8A95AD;
  }

  .tab-item.active .tab-icon {
    color: #2B5EA7;
  }

  .tab-item .tab-label {
    font-size: 10px;
    color: #8A95AD;
    font-weight: 500;
  }

  .tab-item.active .tab-label {
    color: #2B5EA7;
    font-weight: 600;
  }

  .home-indicator {
    width: 134px;
    height: 5px;
    background: #1a1a1a;
    border-radius: 3px;
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9;
  }
</style>
</head>
